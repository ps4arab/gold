<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Store</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #ui {
      position: absolute; top: 15px; left: 15px;
      background: rgba(0, 0, 0, 0.7); color: white;
      padding: 12px 18px; border-radius: 8px; pointer-events: none;
    }
    #info { font-weight: bold; color: #4ade80; margin-top: 5px; }
  </style>
</head>
<body>
  <div id="ui">
    <div>Move: <b>W A S D</b> or <b>Arrow Keys</b> | Click a box to select</div>
    <div id="info">Selected: None</div>
  </div>

  <!-- Load Three.js -->
  <script src="https://cloudflare.com"></script>
  <script>
    // 1. Scene, Camera, Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e293b);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. Lighting & Floor
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 50),
      new THREE.MeshStandardMaterial({ color: 0x334155 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // 3. Create Rows of Product Boxes
    const boxes = [];
    const geometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
    const colors = [0xef4444, 0x3b82f6, 0x10b981, 0xf59e0b, 0x8b5cf6];

    for (let row = 0; row < 5; row++) {
      for (let col = -1; col <= 1; col += 2) { // Left (-1) and Right (1) aisles
        const color = colors[Math.floor(Math.random() * colors.length)];
        const material = new THREE.MeshStandardMaterial({ color });
        const box = new THREE.Mesh(geometry, material);
        
        box.position.set(col * 3, 0.6, -row * 4);
        box.userData = { name: `Product #${boxes.length + 1}`, price: `$${(row + 1) * 15}` };
        
        scene.add(box);
        boxes.push(box);
      }
    }

    // 4. Keyboard Navigation
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    // 5. Click Detection (Raycasting)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const infoDiv = document.getElementById('info');

    window.addEventListener('click', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(boxes);

      if (intersects.length > 0) {
        const clickedBox = intersects[0].object;
        infoDiv.innerText = `Selected: ${clickedBox.userData.name} (${clickedBox.userData.price})`;
        clickedBox.scale.set(1.2, 1.2, 1.2); // Pop effect
        setTimeout(() => clickedBox.scale.set(1, 1, 1), 200);
      }
    });

    // 6. Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      const speed = 0.12;
      if (keys['w'] || keys['arrowup']) camera.position.z -= speed;
      if (keys['s'] || keys['arrowdown']) camera.position.z += speed;
      if (keys['a'] || keys['arrowleft']) camera.position.x -= speed;
      if (keys['d'] || keys['arrowright']) camera.position.x += speed;

      renderer.render(scene, camera);
    }
    animate();

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
