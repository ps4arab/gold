  <script>
    const display = document.getElementById('status-display');
    const buttons = document.querySelectorAll('.key-btn');

    // Function that dispatches a real browser KeyboardEvent
    function triggerRealKeyEvent(type, button) {
      const key = button.getAttribute('data-key');
      const code = button.getAttribute('data-code');
      const keyCode = Number(button.getAttribute('data-keycode'));

      const event = new KeyboardEvent(type, {
        key: key,
        code: code,
        keyCode: keyCode,
        which: keyCode,
        bubbles: true,
        cancelable: true
      });

      document.dispatchEvent(event);
    }

    // Bind pointerdown (press) and pointerup (release) to each on-screen button
    buttons.forEach(button => {
      button.addEventListener('pointerdown', (e) => {
        e.preventDefault(); // Prevents focus stealing
        button.classList.add('pressed');
        triggerRealKeyEvent('keydown', button);
      });

      const releaseKey = () => {
        if (button.classList.contains('pressed')) {
          button.classList.remove('pressed');
          triggerRealKeyEvent('keyup', button);
        }
      };

      button.addEventListener('pointerup', releaseKey);
      button.addEventListener('pointerleave', releaseKey);
      button.addEventListener('pointercancel', releaseKey);
    });

    // Global listener: catches BOTH physical keyboard presses AND on-screen clicks!
    document.addEventListener('keydown', (event) => {
      const label = event.key === ' ' ? 'SPACE' : event.key.toUpperCase();
      display.textContent = `Key Down: ${label} (code: ${event.code})`;

      const btn = document.querySelector(`.key-btn[data-code="${event.code}"]`);
      if (btn) btn.classList.add('pressed');
    });

    document.addEventListener('keyup', (event) => {
      const label = event.key === ' ' ? 'SPACE' : event.key.toUpperCase();
      display.textContent = `Key Up: ${label}`;

      const btn = document.querySelector(`.key-btn[data-code="${event.code}"]`);
      if (btn) btn.classList.remove('pressed');
    });
  </script>
